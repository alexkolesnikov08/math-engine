[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-equation-solver"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.3",
]
server = [
    "fastapi",
    "uvicorn",
    "httpx",
]

# Flat layout: top-level modules; never package tests/.
[tool.setuptools]
py-modules = ["engine", "main", "steps", "parsing", "step_builders", "extensions", "linalg", "api"]

[tool.setuptools.packages.find]
exclude = ["tests*"]

# Intentionally minimal lint baseline (ruff defaults): syntax errors + pyflakes.
# Broader rule sets flag pre-existing style issues in engine code;
# tighten only together with a code cleanup.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that run the CLI as a subprocess",
]
